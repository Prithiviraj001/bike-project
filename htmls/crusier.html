<html lang="en">

<head>
  <meta charset="UTF-8">

  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&family=Orbitron:wght@500;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/crusier.css">
</head>

<body>

  <header class="head">
    <div class="logo-box">
      <img src="../images/logo/icon.png" class="ico">
      <span class="logo-text">MotoHub</span>
    </div>

    <ul class="navigation">
      <li><a href="index.html">Home</a></li>

    </ul>
  </header>

  <section class="cruiser-hero">
    <h1>Cruiser Bikes</h1>
    <p>Comfort • Style • Long Ride Performance</p>
  </section>



  <section class="bike-section">

    <div class="bike-card" style="position:relative;" data-price="205000">
      <i class="fas fa-heart wishlist-btn" data-bike-id="re_meteor350"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/most popular/re.webp">
      <h3>Royal Enfield Meteor 350</h3>
      <p class="price">₹ 2.05 Lakh*</p>
      <p class="rating">4.5/5 ⭐ | 349cc | 20.2 PS</p>
    </div>

    <div class="bike-card" style="position:relative;" data-price="710000">
      <i class="fas fa-heart wishlist-btn" data-bike-id="kawasaki_vulcans"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/most popular/kawaki.png">
      <h3>Kawasaki Vulcan S</h3>
      <p class="price">₹ 7.10 Lakh*</p>
      <p class="rating">4.6/5 ⭐ | 649cc | 61 PS</p>
    </div>

    <div class="bike-card" style="position:relative;" data-price="128000">
      <i class="fas fa-heart wishlist-btn" data-bike-id="suzuki_intruder"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/suzuki/hayabusa_processed.webp">
      <h3>Suzuki Intruder</h3>
      <p class="price">₹ 1.28 Lakh*</p>
      <p class="rating">4.3/5 ⭐ | 155cc | 14 PS</p>
    </div>

  </section>

  <script src="../js/main.js"></script>
