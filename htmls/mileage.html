<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&family=Orbitron:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/mileage.css">

<body>

  <header class="head">
    <div class="logo-box">
      <img src="../images/logo/icon.png" class="ico">
      <span class="logo-text">MotoHub</span>
    </div>

    <ul class="navigation">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
    <div class="menu-btn"><i class="fa fa-bars"></i></div>
  </header>

  <section class="mileage-hero">
    <h1>Mileage Bikes</h1>
    <p>Maximum Efficiency • Minimum Fuel Cost</p>
  </section>



  <section class="bike-section">

    <div class="bike-card" style="position:relative;" data-price="78020">
      <i class="fas fa-heart wishlist-btn" data-bike-id="hero_splendorplus"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/hero/hero splendor plu_processed.webp">
      <h3>Hero Splendor Plus</h3>
      <p class="price">₹ 78,020*</p>
      <p class="rating">4.5/5 ⭐ | 97cc | 65 kmpl</p>
    </div>

    <div class="bike-card" style="position:relative;" data-price="70000">
      <i class="fas fa-heart wishlist-btn" data-bike-id="tvs_sport"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/tvs/tvs-sport65eebb0579c57.webp">
      <h3>TVS Sport</h3>
      <p class="price">₹ 70,000*</p>
      <p class="rating">4.5/5 ⭐ | 109cc | 70 kmpl</p>
    </div>

    <div class="bike-card" style="position:relative;" data-price="80000">
      <i class="fas fa-heart wishlist-btn" data-bike-id="honda_shine"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/honda/Honda shine.png">
      <h3>Honda Shine</h3>
      <p class="price">₹ 80,000*</p>
      <p class="rating">4.3/5 ⭐ | 124cc | 65 kmpl</p>
    </div>

  </section>

  <script src="../js/main.js"></script>
