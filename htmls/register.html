<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MotoHub</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&family=Orbitron:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/register.css">
</head>

<body>

  <header class="head">
    <div class="logo-box">
      <img src="../images/logo/icon.png" class="ico">
      <span class="logo-text">MotoHub</span>
    </div>

    <ul class="navigation">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>

    <div class="menu-btn"><i class="fa fa-bars"></i></div>
  </header>

  <div class="register-page">
    <div class="register-box">

      <h2>Create Account</h2>

      <form action="login.html">

        <div class="input-box">
          <input type="text" placeholder="Full Name" required>
        </div>

        <div class="input-box">
          <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-box">
          <input type="text" placeholder="Username" required>
        </div>

        <div class="input-box">
          <input type="password" placeholder="Password" minlength="8" required>
        </div>

        <div class="input-box">
          <input type="password" placeholder="Confirm Password" minlength="8" required>
        </div>

        <button type="submit" class="register-btn">Register</button>

        <p class="login-link">
          Already have an account? <a href="login.html">Login</a>
        </p>

      </form>

    </div>
  </div>

  <script src="../js/main.js"></script>
</body>

</html>
