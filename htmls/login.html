<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MotoHub</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&family=Orbitron:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>

  <header class="head">
    <div class="logo-box">
      <img src="../images/logo/icon.png" class="ico">
      <span class="logo-text">MotoHub</span>
    </div>

    <ul class="navigation">
      <li><a href="./index.html">Home</a></li>
      <li><a href="./about.html">About</a></li>
      <li><a href="./contact.html">Contact</a></li>
      <li><a href="./services.html">Services</a></li>
      <li><a href="./login.html" class="active">
          <img src="../images/logo/user.png"> Login
        </a></li>
    </ul>

    <div class="menu-btn"><i class="fa fa-bars"></i></div>
  </header>

  <div class="login-page">
    <div class="login-box">

      <h2>Welcome Back</h2>

      <form action="./index.html">
        <div class="input-box">
          <input type="text" placeholder="Username" required>
        </div>

        <div class="input-box">
          <input type="password" placeholder="Password" minlength="8" required>
        </div>

        <div class="options">
          <label><input type="checkbox"> Remember Me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p class="register">
          Don't have an account? <a href="./register.html">Register</a>
        </p>

      </form>

    </div>
  </div>

  <script src="../js/main.js"></script>
</body>

</html>
