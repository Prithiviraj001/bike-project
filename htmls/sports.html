<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&family=Orbitron:wght@500;700&display=swap"

<body>

  <header class="head">
    <div class="logo-box">
      <img src="../images/logo/icon.png" class="ico">
      <span class="logo-text">MotoHub</span>
    </div>

    <ul class="navigation">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>

    </ul>
    <div class="menu-btn"><i class="fa fa-bars"></i></div>

  <section class="sports-hero">
    <h1>Sports Bikes</h1>
    <p>Power • Speed • Performance</p>
  </section>



  <section class="bike-section">

    <div class="bike-card" style="position:relative;" data-price="1620000">
      <i class="fas fa-heart wishlist-btn" data-bike-id="suzuki_hayabusa"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/suzuki/hayabusa_processed.webp">
      <h3>Suzuki Hayabusa</h3>
      <p class="price">₹ 16.20 Lakh*</p>
      <p class="rating">4.5/5 ⭐ | 1340cc | 190 PS</p>
    </div>

    <div class="bike-card" style="position:relative;" data-price="300000">
      <i class="fas fa-heart wishlist-btn" data-bike-id="yamaha_mt03"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/most popular/mt.jpg">
      <h3>Yamaha MT 03</h3>
      <p class="price">₹ 3 Lakh*</p>
      <p class="rating">4.2/5 ⭐ | 321cc | 41 PS</p>
    </div>

    <div class="bike-card" style="position:relative;" data-price="196000">
      <i class="fas fa-heart wishlist-btn" data-bike-id="ktm_duke200"
        style="position:absolute; top:15px; right:15px; font-size:22px; color:#fff; text-shadow:0 0 4px #000; cursor:pointer; z-index:10; transition: transform 0.2s, color 0.2s;"></i>
      <img src="../images/most popular/ktm duke.webp">
      <h3>KTM Duke 200</h3>
      <p class="price">₹ 1.96 Lakh*</p>
      <p class="rating">4.5/5 ⭐ | 199cc | 25 PS</p>
    </div>

  </section>

  <script src="../js/main.js"></script>
