<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | MotoHub</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/contact.css">
</head>

<body>

  <header class="head">
    <div class="logo-box">
      <img src="../images/logo/icon.png" class="ico">
      <span class="logo-text">MotoHub</span>
    </div>

    <ul class="navigation">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="login.html"><img src="../images/logo/user.png"> Login</a></li>
    </ul>

    <div class="menu-btn"><i class="fa fa-bars"></i></div>
  </header>

  <section class="contact-section">
    <h1 class="k1">Contact MotoHub</h1>

    <div class="section">

      <div class="main">
        <h2>Contact Information</h2>
        <ul>
          <li><i class="fa fa-phone"></i> +91-9877655434</li>
          <li><i class="fa fa-envelope"></i> motohub@gmail.com</li>
          <li><i class="fa fa-telegram"></i> @motohub</li>
          <li><i class="fa fa-map-marker"></i> Chennai, Tamil Nadu, India</li>
        </ul>

        <br>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.585501700688!2d80.20811797585097!3d13.062002814882194!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a52668b8ecbd1bd%3A0xeab78fba814e5659!2sChennai%2C%20Tamil%20Nadu!5e0!3m2!1sen!2sin!4v1714574981881!5m2!1sen!2sin"
          width="100%" height="250" style="border:0; border-radius:10px; box-shadow:0 0 10px #d4af37;"
          allowfullscreen="" loading="lazy"></iframe>

      </div>

      <div class="main2" style="background:#1a1a1a; padding:30px; border-radius:10px; border-top: 4px solid #d4af37;">
        <h2 style="color:#d4af37; margin-bottom: 20px;">Send Us a Message</h2>
        <form class="contact-form" action="#">
          <input type="text" placeholder="Your Name" required
            style="width:100%; padding:10px; margin-bottom:15px; background:#333; border:none; color:white; border-radius:5px;">
          <input type="email" placeholder="Your Email" required
            style="width:100%; padding:10px; margin-bottom:15px; background:#333; border:none; color:white; border-radius:5px;">
          <textarea placeholder="Your Message" rows="5" required
            style="width:100%; padding:10px; margin-bottom:15px; background:#333; border:none; color:white; border-radius:5px;"></textarea>
          <button type="submit" id="contactSubmit"
            style="width:100%; padding:12px; background:#d4af37; font-weight:bold; border:none; border-radius:5px; cursor:pointer;">Send
            Message</button>
        </form>
      </div>

    </div>
  </section>

  <script src="../js/main.js"></script>

</body>

</html>
